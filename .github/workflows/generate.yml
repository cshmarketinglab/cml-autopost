name: 1. 매일 초안 생성

on:
  schedule:
    - cron: "30 20 * * *"   # 매일 05:30 KST (UTC 20:30) — GitHub 지연 감안해 여유 있게
  workflow_dispatch:
    inputs:
      date: { description: "생성 날짜 YYYY-MM-DD (비우면 오늘)", required: false }
      force: { description: "이미 있어도 다시 생성", type: boolean, default: false }

permissions:
  contents: write
  issues: write

concurrency: { group: autopost-repo, cancel-in-progress: false }

jobs:
  generate:
    runs-on: ubuntu-24.04   # 26으로 자동 전환 시 크롬 설치 깨질 수 있어 고정
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: 헤드리스 크롬 + 한글 폰트
        run: |
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -qq fonts-noto-cjk >/dev/null

      - name: 뉴스 수집·선별 (실패해도 초안 생성은 계속)
        id: news
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          INPUT_DATE: ${{ inputs.date }}
        run: |
          D="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
          [ -f "news/$D.json" ] && exit 0   # 재생성 시 뉴스는 다시 안 모음
          cd src && python news.py "$D" > /tmp/news.md
          [ -s /tmp/news.md ] && echo "has=true" >> "$GITHUB_OUTPUT" || true

      - name: 생성
        id: gen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}   # 선택 (신규 발급 중단됨)
          INPUT_DATE: ${{ inputs.date }}
          INPUT_FORCE: ${{ inputs.force }}
        run: |
          D="${INPUT_DATE:-$(TZ=Asia/Seoul date +%F)}"
          echo "date=$D" >> "$GITHUB_OUTPUT"
          ARGS="$D"; [ "$INPUT_FORCE" = "true" ] && ARGS="$D --force"
          cd src && python generate.py $ARGS

      - name: 커밋
        run: |
          git config user.name "cml-bot"
          git config user.email "cml-bot@users.noreply.github.com"
          for p in queue out history.json news news_seen.json; do [ -e "$p" ] && git add "$p"; done
          git diff --cached --quiet && exit 0
          git commit -m "draft: ${{ steps.gen.outputs.date }}"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done

      - name: 검수 이슈 열기 (auto_approve=false, 새로 생성됐을 때만)
        if: steps.gen.outputs.generated == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.gen.outputs.date }}
        run: |
          AUTO=$(python -c "import yaml;print(yaml.safe_load(open('config.yaml'))['auto_approve'])")
          [ "$AUTO" = "True" ] && exit 0
          (cd src && python review.py body "$D") > /tmp/body.md
          gh label create draft --color BFD4F2 2>/dev/null || true
          # 재생성이면 같은 날짜의 기존 초안 이슈 닫기
          for n in $(gh issue list --state open --search "[초안] $D in:title" --json number,title -q ".[] | select(.title==\"[초안] $D\") | .number"); do
            gh issue close "$n" --comment "재생성됨 → 새 이슈 참고"
          done
          gh issue create --title "[초안] $D" --body-file /tmp/body.md --label draft

      - name: 뉴스 이슈 올리기 (어제 뉴스 이슈는 자동으로 닫기)
        if: steps.news.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          D: ${{ steps.gen.outputs.date }}
        run: |
          gh label create news --color FBCA04 2>/dev/null || true
          for n in $(gh issue list --state open --label news --json number -q '.[].number'); do
            gh issue close "$n"
          done
          gh issue create --title "[뉴스] $D" --body-file /tmp/news.md --label news
